<div class="auth-wrap">
  <div class="auth-head">
    <div class="brand-mark">RE</div>
    <h1>Sign in</h1>
    <p class="muted">Practise past examination papers and get marked instantly.</p>
  </div>

  <div class="card">
    {% if errors.length > 0 %}
      <div class="notice notice-error">
        <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
      </div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="_csrf" value="{{ csrfToken }}">
      <input type="hidden" name="next" value="{{ nextUrl }}">

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" value="{{ values.email || '' }}"
               required autocomplete="username" autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="button button-block">Sign in</button>
    </form>
  </div>

  <p class="auth-alt">No account yet? <a href="/register">Create one</a></p>
</div>
