<!doctype html>

<head>

<title>You're offline · Rivaesa</title>
<style>

  .mark svg { width:60%; height:auto; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; }
  p { color:#5a6270; font-size:.95rem; line-height:1.5; margin:0 0 1.25rem; }
  button { font:inherit; padding:.6rem 1.2rem; border-radius:8px; border:none; background:#0E7490; color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="18" cy="6" r="4.4" fill="#fff" opacity="0.14"/>
        <path d="M3 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 3 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

        <path d="M3 9c2.2 0 2.2-2.6 4.4-2.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
        <circle cx="18" cy="6" r="2.3" fill="#fff"/>
      </svg>
    </div>
    <h1>You're offline</h1>
